<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Moratto Personal</title><link rel="stylesheet" href="login.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="box"><div class="logo">MORATTO PERSONAL</div><h1>ACESSO</h1><p class="muted">Escolha seu perfil. Login e senha são obrigatórios.</p><div class="roles" role="group" aria-label="Tipo de acesso"><button class="role" type="button" data-role="student">Área do aluno</button><button class="role" type="button" data-role="admin">Área do Personal</button></div><form id="form" novalidate><div class="field"><label for="login">Login</label><input id="login" name="login" autocomplete="username" required></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div class="msg" id="msg" role="alert" aria-live="polite"></div><button class="btn" type="submit">ENTRAR</button></form><p class="demo-hint">Demo: aluno / 123456 · personal: raylton / 123456</p><a class="back" href="index.html">← Voltar ao site</a></main><script src="data.js"></script><script>const params=new URLSearchParams(location.search);let role=params.get('role')==='admin'?'admin':'student';const roleButtons=[...document.querySelectorAll('.role')];const message=document.getElementById('msg');function setRole(next){role=next;roleButtons.forEach((button)=>{const active=button.dataset.role===role;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});message.textContent='';}roleButtons.forEach((button)=>button.addEventListener('click',()=>setRole(button.dataset.role)));setRole(role);document.getElementById('form').addEventListener('submit',(event)=>{event.preventDefault();const login=document.getElementById('login').value.trim().toLowerCase();const password=document.getElementById('password').value;if(!login||!password){message.textContent='Preencha login e senha.';return;}const account=MorattoDB.loadDB().accounts.find((item)=>item.role===role&&item.login.toLowerCase()===login&&item.password===password);if(!account){message.textContent='Login ou senha inválidos.';return;}MorattoDB.setSession(account);location.href=role==='admin'?'admin.html':'student.html';});</script></body></html>
