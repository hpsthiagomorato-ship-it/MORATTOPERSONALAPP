<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Moratto Personal</title><link rel="stylesheet" href="login.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><main class="box"><div class="logo">MORATTO PERSONAL</div><h1>ACESSO</h1><p class="muted">Escolha seu perfil. Login e senha são obrigatórios.</p><div class="roles"><button class="role" data-role="student">Área do aluno</button><button class="role" data-role="admin">Área do Personal</button></div><form id="form"><div class="field"><label>Login</label><input id="login" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><div class="msg" id="msg"></div><button class="btn">ENTRAR</button></form><a class="back" href="index.html">← Voltar ao site</a></main><script src="data.js"></script><script>const qs=new URLSearchParams(location.search);let role=qs.get('role')||'student';const roles=[...document.querySelectorAll('.role')];function setRole(r){role=r;roles.forEach(b=>b.classList.toggle('active',b.dataset.role===r))}roles.forEach(b=>b.onclick=()=>setRole(b.dataset.role));setRole(role);document.getElementById('form').onsubmit=e=>{e.preventDefault();const db=loadDB();const u=db.accounts.find(a=>a.role===role&&a.login===document.getElementById('login').value.trim()&&a.password===document.getElementById('password').value);if(!u){document.getElementById('msg').textContent='Login ou senha inválidos.';return}sessionStorage.setItem('moratto_auth',JSON.stringify(u));location.href=role==='admin'?'admin.html':'student.html'}</script></body></html>
