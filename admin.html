<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do Personal | Moratto</title><link rel="stylesheet" href="app.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><div class="shell"><aside class="side"><div class="logo">MORATTO PERSONAL</div><a href="index.html">← Voltar ao site</a><button onclick="show('dashboard')">Dashboard</button><button onclick="show('students')">Alunos</button><button onclick="show('workouts')">Treinos</button><button onclick="show('agenda')">Agenda</button><button onclick="show('finance')">Financeiro</button><button onclick="show('evolution')">Evolução</button><button onclick="logout()">Sair</button></aside><main class="main"><div class="top"><h1 id="title">DASHBOARD</h1><span class="muted" id="who"></span></div><div id="content"></div></main></div><script src="data.js"></script><script>const a=JSON.parse(sessionStorage.getItem('moratto_auth')||'null');if(!a||a.role!=='admin'){location.replace('login.html?role=admin')}else{document.getElementById('who').textContent=a.name||'Personal';}const content=document.getElementById('content');function show(v){const db=loadDB();document.getElementById('title').textContent=v.toUpperCase();if(v==='dashboard'){content.innerHTML=`<div class="grid"><div class="card"><div class="metric">${db.students.length}</div><div class="muted">Alunos</div></div><div class="card"><div class="metric">${db.workouts.length}</div><div class="muted">Treinos</div></div><div class="card"><div class="metric">${db.events.length}</div><div class="muted">Eventos</div></div><div class="card"><div class="metric">${db.payments.length}</div><div class="muted">Pagamentos</div></div></div><div class="card" style="margin-top:14px"><p class="muted">Área privada funcionando. Use o menu para gerenciar alunos, treinos e agenda.</p></div>`}else if(v==='students'){content.innerHTML='<div class="card"><table class="table"><thead><tr><th>Nome</th><th>Objetivo</th><th>Peso</th><th>Login</th></tr></thead><tbody>'+db.students.map(s=>{const ac=db.accounts.find(x=>x.studentId===s.id);return `<tr><td>${s.name}</td><td>${s.goal||'-'}</td><td>${s.weight||'-'} kg</td><td>${ac?.login||'-'}</td></tr>`}).join('')+'</tbody></table></div>'}else if(v==='workouts'){content.innerHTML='<div class="card"><table class="table"><thead><tr><th>Treino</th><th>Aluno</th><th>Exercícios</th></tr></thead><tbody>'+db.workouts.map(w=>`<tr><td>${w.name}</td><td>${db.students.find(s=>s.id===w.studentId)?.name||'-'}</td><td>${w.items.length}</td></tr>`).join('')+'</tbody></table></div>'}else if(v==='agenda'){content.innerHTML='<div class="card"><p class="muted">Nenhum evento cadastrado ainda.</p></div>'}else if(v==='finance'){content.innerHTML='<div class="card"><p class="muted">Nenhum pagamento cadastrado ainda.</p></div>'}else if(v==='evolution'){content.innerHTML='<div class="card"><p class="muted">Registre avaliações na base local para acompanhar a evolução.</p></div>'}}function logout(){sessionStorage.removeItem('moratto_auth');location.href='login.html?role=admin'}show('dashboard')</script></body></html>
