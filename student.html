<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do Aluno | Moratto</title><link rel="stylesheet" href="app.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;700;900&display=swap" rel="stylesheet"></head><body><div class="shell"><aside class="side"><div class="logo">MORATTO PERSONAL</div><a href="index.html">← Voltar ao site</a><button onclick="show('home')">Minha área</button><button onclick="show('workout')">Meu treino</button><button onclick="show('evolution')">Evolução</button><button onclick="logout()">Sair</button></aside><main class="main"><div class="top"><h1 id="title">MINHA ÁREA</h1><span class="muted" id="who"></span></div><div id="content"></div></main></div><script src="data.js"></script><script>const a=JSON.parse(sessionStorage.getItem('moratto_auth')||'null');if(!a||a.role!=='student'){location.replace('login.html?role=student')}else{document.getElementById('who').textContent=a.name||'Aluno'}const content=document.getElementById('content');function show(v){const db=loadDB(),st=db.students.find(s=>s.id===a.studentId),w=db.workouts.find(x=>x.studentId===a.studentId);document.getElementById('title').textContent=v==='home'?'MINHA ÁREA':v.toUpperCase();if(v==='home'){content.innerHTML=`<div class="grid"><div class="card"><div class="metric">${st?.weight??'-'}</div><div class="muted">Peso (kg)</div></div><div class="card"><div class="metric">${w?.items?.length||0}</div><div class="muted">Exercícios no treino</div></div></div><div class="card" style="margin-top:14px"><h3>Objetivo</h3><p class="muted">${st?.goal||'Defina seu objetivo com o Personal.'}</p></div>`}else if(v==='workout'){content.innerHTML=`<div class="card"><h3>${w?.name||'Nenhum treino atribuído'}</h3>${w?'<table class="table"><thead><tr><th>Exercício</th><th>Séries</th><th>Reps</th><th>Status</th></tr></thead><tbody>'+w.items.map((i,idx)=>`<tr><td>${i.name}</td><td>${i.sets}</td><td>${i.reps}</td><td><button class="btn ${i.done?'primary':''}" onclick="toggleDone(${idx})">${i.done?'Concluído':'Marcar'}</button></td></tr>`).join('')+'</tbody></table>':'<p class="muted">Seu treino aparecerá aqui.</p>'}</div>`}else{content.innerHTML='<div class="card"><p class="muted">Registre peso e avaliações para acompanhar sua evolução.</p></div>'}}function toggleDone(idx){const db=loadDB(),w=db.workouts.find(x=>x.studentId===a.studentId);if(w&&w.items[idx]){w.items[idx].done=!w.items[idx].done;saveDB(db);show('workout')}}function logout(){sessionStorage.removeItem('moratto_auth');location.href='login.html?role=student'}show('home')</script></body></html>
